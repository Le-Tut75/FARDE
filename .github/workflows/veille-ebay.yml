name: Veille eBay

on:
  schedule:
    - cron: '41 * * * *'    # toutes les heures (à :41)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

concurrency:
  group: veille-ebay
  cancel-in-progress: true

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: job/package-lock.json

      - name: Installer
        working-directory: job
        run: npm ci --no-audit --no-fund

      - name: Chercher les nouvelles annonces
        working-directory: job
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node ebay.mjs
