<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Farde</title>
<meta name="description" content="Collection et portefeuille de cartes Pokémon : cotes Cardmarket quotidiennes, scellés, fardes, import de tableur.">
<meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1214" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 19V10l8-6 8 6v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><rect x="7" y="3" width="12" height="16" rx="2"/><path d="M5 6.5v12A2.5 2.5 0 0 0 7.5 21H15"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M3.5 8 12 4l8.5 4v8L12 20l-8.5-4Z"/><path d="M3.5 8 12 12l8.5-4M12 12v8"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4m0 0-4 4m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-binder" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v18M12.5 8h4M12.5 12h4"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><path d="M14 17l2 2 4-4"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></symbol>
 <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><path d="M4 7.5V17a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 1 4 7.5Z"/><circle cx="16" cy="13.5" r="1.2"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3.5 7.5 9 13l3.5-3.5 8 8"/><path d="M14.5 17.5h6v-6"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-ebay" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></symbol>
</svg>

<div id="boot" class="boot"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span></div>

<!-- Connexion -->
<section id="auth" class="auth" hidden>
  <form id="authForm" class="auth-card">
    <div class="brand-lg"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><h1>Farde</h1></div>
    <p class="muted">Ta collection Pokémon, cotée chaque matin sur Cardmarket.</p>
    <div class="field"><label for="authEmail">E-mail</label><input id="authEmail" type="email" autocomplete="email" required></div>
    <div class="field"><label for="authPass">Mot de passe</label><input id="authPass" type="password" autocomplete="current-password" minlength="8" required></div>
    <p class="loss" id="authErr" role="alert"></p>
    <button class="btn pri" type="submit" id="authSubmit">Se connecter</button>
    <button class="btn ghost" type="button" id="authToggle">Créer un compte</button>
  </form>
</section>

<!-- Application -->
<div id="app" class="shell" hidden>
  <aside class="side" aria-label="Navigation">
    <a href="#portefeuille" class="brand-link"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="brand-name">Farde</span></a>
    <button type="button" class="gsearch" data-gsearch><svg><use href="#i-search"/></svg><span>Rechercher</span><kbd>/</kbd></button>
    <nav id="nav" class="side-nav">
      <a href="#portefeuille" data-route="portefeuille"><svg><use href="#i-home"/></svg>Tableau de bord</a>
      <a href="#collection" data-route="collection"><svg><use href="#i-cards"/></svg>Ma collection</a>
      <a href="#ajouter" data-route="ajouter" class="nav-add"><svg><use href="#i-plus"/></svg>Ajouter des items</a>
      <a href="#catalogue" data-route="marche"><svg><use href="#i-trend"/></svg>Marché</a>
      <a href="#wishlist" data-route="wishlist"><svg><use href="#i-heart"/></svg>Wishlist</a>
      <span class="side-sep"></span>
      <a href="#reglages" data-route="reglages"><svg><use href="#i-gear"/></svg>Réglages</a>
    </nav>
    <div class="side-total"><span class="muted small">Valeur totale</span><b id="hdrValue">—</b><span id="hdrPL" class="small"></span></div>
  </aside>

  <header class="topbar">
    <a href="#portefeuille" class="brand-link"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="brand-name">Farde</span></a>
    <div class="row" style="gap:12px;flex-wrap:nowrap"><button type="button" class="iconbtn" data-gsearch aria-label="Rechercher"><svg><use href="#i-search"/></svg></button>
    <div class="top-total"><b id="hdrValueM">—</b><span id="hdrPLM" class="small"></span></div></div>
  </header>

  <div class="main-wrap">
    <div id="offline" class="banner" hidden></div>
    <main><nav id="subnav" class="subnav" aria-label="Sous-sections" hidden></nav><div id="view"></div></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navigation principale">
    <a href="#portefeuille" data-route="portefeuille"><svg><use href="#i-home"/></svg><span>Accueil</span></a>
    <a href="#collection" data-route="collection"><svg><use href="#i-cards"/></svg><span>Collection</span></a>
    <a href="#ajouter" data-route="ajouter" class="tab-add" aria-label="Ajouter des items"><i><svg><use href="#i-plus"/></svg></i><span>Ajouter</span></a>
    <a href="#catalogue" data-route="marche"><svg><use href="#i-trend"/></svg><span>Marché</span></a>
    <button type="button" id="moreBtn" data-route="plus" aria-haspopup="true" aria-expanded="false"><svg><use href="#i-more"/></svg><span>Plus</span></button>
  </nav>
  <div class="sheet" id="moreSheet" hidden>
    <div class="sheet-card" role="menu">
      <a href="#wishlist" role="menuitem"><svg><use href="#i-heart"/></svg>Wishlist</a>
      <a href="#ventes" role="menuitem"><svg><use href="#i-wallet"/></svg>Ventes</a>
      <a href="#depenses" role="menuitem"><svg><use href="#i-box"/></svg>Dépenses</a>
      <a href="#reglages" role="menuitem"><svg><use href="#i-gear"/></svg>Réglages</a>
    </div>
  </div>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
